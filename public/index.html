<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Habit Tracker NFC</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="contenedor">

  <!-- LOGIN / REGISTRO -->
  <div id="vista-auth">
    <h1>Habit Tracker</h1>
    <div class="tarjeta">
      <h3 id="auth-titulo">Iniciar sesion</h3>
      <div class="error oculto" id="auth-error"></div>
      <input type="email" id="auth-email" placeholder="Email">
      <input type="password" id="auth-password" placeholder="Contraseña">
      <button id="auth-submit">Entrar</button>
      <button class="secundario" id="auth-cambiar" style="margin-top:8px;">Crear una cuenta nueva</button>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="vista-dashboard" class="oculto">
    <div class="top-bar">
      <h1>Mis habitos</h1>
      <span class="monedas">🪙 <span id="monedas-total">0</span></span>
    </div>
    <button class="secundario" id="btn-perfil" style="margin-bottom:12px;">🏆 Ver perfil y trofeos</button>
    <button class="secundario" id="btn-tienda" style="margin-bottom:12px;">🛍️ Tienda</button>
    <div id="lista-habitos"></div>
    <button class="secundario" id="btn-logout" style="margin-top:16px;">Cerrar sesion</button>
    <button class="fab" id="btn-nuevo">+</button>
  </div>

  <!-- FORMULARIO CREAR/EDITAR HABITO -->
  <div id="vista-form" class="oculto">
    <h1 id="form-titulo">Nuevo habito</h1>
    <div class="tarjeta">
      <div class="error oculto" id="form-error"></div>
      <input type="hidden" id="form-id">
      <label>Nombre</label>
      <input type="text" id="form-nombre" placeholder="Ej: Leer 20 minutos">
      <label>Color</label>
      <input type="color" id="form-color" value="#4f46e5">
      <label>Descripcion (opcional)</label>
      <textarea id="form-descripcion" rows="2"></textarea>
      <label>Modo de marcado</label>
      <select
